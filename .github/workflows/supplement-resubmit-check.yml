name: Supplement resubmit check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sv5tot_test

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Targeted unit tests
        run: npx vitest run tests/unit/canonical-supplement-resubmit.test.ts tests/unit/applications-city-submission-gate.test.ts

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
